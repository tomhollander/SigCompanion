id: com.thirtyhippos.sigcompanion
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: SigCompanion.Desktop
appstream-compose: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio
  - --share=network

build-options:
  no-debuginfo: true
  strip: false

modules:
  - name: sigcompanion
    buildsystem: simple
    build-commands:
      - install -d /app/lib/sigcompanion /app/bin
      - cp -a publish/. /app/lib/sigcompanion/
      - ln -s ../lib/sigcompanion/SigCompanion.Desktop /app/bin/SigCompanion.Desktop
      - install -Dm644 com.thirtyhippos.sigcompanion.desktop /app/share/applications/com.thirtyhippos.sigcompanion.desktop
      - install -Dm644 com.thirtyhippos.sigcompanion.metainfo.xml /app/share/metainfo/com.thirtyhippos.sigcompanion.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/com.thirtyhippos.sigcompanion.png
      - install -Dm644 LICENSE.txt /app/share/licenses/com.thirtyhippos.sigcompanion/LICENSE.txt
    sources:
      - type: dir
        path: publish
        dest: publish
      - type: file
        path: com.thirtyhippos.sigcompanion.desktop
      - type: file
        path: com.thirtyhippos.sigcompanion.metainfo.xml
      - type: file
        path: icon.png
      - type: file
        path: LICENSE.txt